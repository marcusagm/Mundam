[package]
name = "mundam-plugin-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[[bin]]
name = "mundam-plugin"
path = "src/main.rs"

[dependencies]
png = "0.18"
ring = "0.17.14"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
