[package]
name = "mundam-runtime-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
windows-boundary = []
component-proof = ["dep:wasmtime"]

[dependencies]
mundam-runtime-transport = { path = "../runtime-transport" }
wasmi = { version = "=2.0.3", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
wasmtime = { version = "=41.0.4", optional = true, default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[profile.dev]
debug = 0

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "=1.49.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
wat = "=1.228.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Pipes", "Win32_System_WindowsProgramming"] }

[[test]]
name = "windows_boundary"
path = "tests/windows_boundary/main.rs"
harness = false
required-features = ["windows-boundary"]
