[package]
name = "mundam"
version = "0.1.0"
description = "Mundam: A professional image reference manager for artists."
authors = ["marcusmaia"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mundam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
libc = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
notify = "8.0"
imagesize = "0.13"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full", "time"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "chrono", "macros", "json"] }
image = { version = "0.25.9", features = ["webp", "hdr", "exr", "dds", "tga", "png", "tiff", "gif"] }
fast_image_resize = "6.0.0"
mime_guess = "2.0"
percent-encoding = "2.3"
rayon = "1.8"
rexif = "0.7"
infer = "0.15"       # Magic bytes detection
strum = { version = "0.26", features = ["derive"] } # Enum iteration
strum_macros = "0.26"
blake3 = "1"

# Color Analysis - K-Means clustering in LAB space
kmeans_colors = "0.6"
palette = "0.7"

# Thumbnail optimization - Fast path
zune-jpeg = "0.4"
webp = "0.3"
zip = "2.1"
resvg = "0.44"
pdfium-render = "0.8"
tiny-skia = "0.11" # Backend for resvg
wuff = "0.2.3"
psd = "0.3"
urlencoding = "2.1"
asefile = "0.3.7"

# HLS Streaming Server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
tauri-plugin-http = "2.5.7"
uuid = { version = "1.20.0", features = ["v4"] }
thiserror = "2.0.18"
memmap2 = "0.9.9"
rsraw = "0.1"
base64 = "0.22"
wait-timeout = "0.2"
byteorder = "1.5"
flate2 = "1.0"
quick-xml = "0.37"
zstd = "0.13.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1.89"
ttf-parser = "0.25"
dashmap = "6.1.0"
unicode-normalization = "0.1"
async-recursion = "1.0.0"
jxl-oxide = "0.12"
icns = "0.4.0"
ddsfile = "=0.5.2"
image_dds = "0.7.2"
midly = "0.5.3"
rustysynth = "1.3.6"
hound = "3.5.1"
tauri-plugin-clipboard-manager = "2"
log = "0.4.33"



# Limit the webp encoder version if needed or just rely on image feature
# But we are using the standalone 'webp' crate for encoding? Yes.

# OPTIMIZATION: Compile heavy dependencies with optimizations even in debug mode
# [profile.dev.package."*"]
# opt-level = 3

[profile.dev.package.rustysynth]
opt-level = 3

[dev-dependencies]
rsraw-sys = "0.1.0"
tempfile = "3.10"
